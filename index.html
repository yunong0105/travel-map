<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🗺️ 槟城旅行地图 - 闭环点选版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { --primary:#1a73e8; --sidebar:320px; }
        *{ box-sizing:border-box; margin:0; padding:0; }
        body,html{ height:100%; font-family: sans-serif; overflow:hidden; }
        #app{ display:flex; height:100vh; }
        #sidebar{ width:var(--sidebar); background:#fff; border-right:1px solid #eee; display:flex; flex-direction:column; z-index:10; }
        #map{ flex:1; z-index:1; }
        #cfg-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:999999; display:flex; align-items:center; justify-content:center; }
        #cfg-overlay.hidden { display:none !important; }
        .cfg-box { background:#fff; padding:25px; border-radius:16px; width:340px; text-align:center; }
        .cfg-input { width:100%; margin-bottom:12px; padding:12px; border:1px solid #ddd; border-radius:8px; }
        #topbar{ padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
        #poi-list{ flex:1; overflow-y:auto; padding:10px; }
        .day-section { margin-bottom: 20px; }
        .day-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .optimize-btn { font-size:11px; background:#e8f0fe; color:var(--primary); border:none; padding:5px 12px; border-radius:15px; cursor:pointer; }
        .optimize-btn.active { background:#ea4335; color:#fff; }
        .poi-card { display:flex; align-items:center; gap:10px; padding:10px; border-radius:8px; cursor:pointer; border:2px solid transparent; margin-bottom:5px; transition:0.2s; }
        .poi-card:hover { background:#f8f9fa; }
        .poi-card.picked-start { border-color:#34a853; background:#e6f4ea; }
        .poi-card.picked-end { border-color:#ea4335; background:#fce8e6; }
        .poi-num { width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; flex-shrink:0; }
        .poi-name { font-size:13px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 20px; border-radius:20px; z-index:1000000; display:none; }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div id="cfg-overlay">
        <div class="cfg-box">
            <h3 style="margin-bottom:15px">⚙️ 配置 Notion</h3>
            <input id="cfg-token" class="cfg-input" type="password" placeholder="Notion Secret Token">
            <input id="cfg-dbid" class="cfg-input" placeholder="Database ID">
            <button onclick="saveConfig()" style="width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer;">保存并进入地图</button>
        </div>
    </div>
    <div id="app">
        <div id="sidebar">
            <div id="topbar"><h3>🗺️ 旅行地图</h3><button onclick="loadData()" style="padding:4px 8px; font-size:11px;">刷新</button></div>
            <div id="poi-list"></div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, allPlaces = [], markers = {}, polylines = [];
        let isSelecting = false, selectionType = 'start', startPoint = null, endPoint = null;
        const COLORS = ['#1a73e8', '#34a853', '#fabc05', '#ea4335', '#9334e6', '#11739d'];

        window.onload = () => {
            map = L.map('map', { zoomControl: false }).setView([5.42, 100.33], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            const cfg = localStorage.getItem('ntm_cfg');
            if (cfg) { document.getElementById('cfg-overlay').classList.add('hidden'); loadData(); }
        };

        function saveConfig() {
            const token = document.getElementById('cfg-token').value.trim();
            const dbid = document.getElementById('cfg-dbid').value.trim();
            if (token && dbid) {
                localStorage.setItem('ntm_cfg', JSON.stringify({token, dbid}));
                document.getElementById('cfg-overlay').classList.add('hidden');
                loadData();
            }
        }

        async function notionReq(path, method='GET', body=null) {
            const cfg = JSON.parse(localStorage.getItem('ntm_cfg'));
            const url = `https://corsproxy.io/?${encodeURIComponent('https://api.notion.com/v1' + path)}`;
            try {
                const res = await fetch(url, {
                    method, headers: { 'Authorization': `Bearer ${cfg.token}`, 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json' },
                    body: body ? JSON.stringify(body) : null
                });
                return await res.json();
            } catch (e) { return null; }
        }

        async function loadData() {
            showToast("正在拉取数据...");
            const cfg = JSON.parse(localStorage.getItem('ntm_cfg'));
            const data = await notionReq(`/databases/${cfg.dbid}/query`, 'POST');
            if (data && data.results) {
                allPlaces = data.results.map(page => {
                    const p = page.properties;
                    const ll = (p['经纬度']?.rich_text?.[0]?.plain_text || "0,0").split(',');
                    return {
                        id: page.id,
                        name: p['地点名']?.title?.[0]?.plain_text || '未命名',
                        lat: parseFloat(ll[0]), lng: parseFloat(ll[1]),
                        day: p['行程日']?.select?.name || '未分组',
                        order: p['当日顺序']?.number || 0
                    };
                }).filter(p => !isNaN(p.lat) && p.lat !== 0);
                renderSidebar(); renderMap(); showToast("同步成功", true);
            } else { showToast("加载失败，请检查配置或网络", true); }
        }

        function renderSidebar() {
            const groups = {};
            allPlaces.forEach(p => { if(!groups[p.day]) groups[p.day]=[]; groups[p.day].push(p); });
            const list = document.getElementById('poi-list');
            list.innerHTML = Object.keys(groups).sort().map((day, idx) => {
                const color = COLORS[idx % COLORS.length];
                groups[day].sort((a,b) => a.order - b.order);
                return `
                    <div class="day-section" id="section-${day}">
                        <div class="day-header"><b style="color:${color}">${day}</b><button class="optimize-btn" id="btn-${day}" onclick="toggleSelectMode('${day}')">点选优化</button></div>
                        ${groups[day].map(p => `
                            <div class="poi-card" id="card-${p.id}" onclick="handleCardClick('${p.id}', '${day}')">
                                <div class="poi-num" style="background:${color}">${p.order}</div>
                                <div class="poi-name">${p.name}</div>
                            </div>
                        `).join('')}
                    </div>`;
            }).join('');
        }

        function toggleSelectMode(day) {
            if (isSelecting) { resetSelectMode(); return; }
            isSelecting = true; selectionType = 'start';
            showToast("请点击【起点】卡片", false);
            document.getElementById(`btn-${day}`).innerText = "❌取消";
            document.getElementById(`btn-${day}`).classList.add('active');
        }

        function handleCardClick(id, day) {
            if (!isSelecting) { const p = allPlaces.find(x => x.id === id); map.flyTo([p.lat, p.lng], 16); return; }
            if (selectionType === 'start') {
                startPoint = allPlaces.find(x => x.id === id);
                document.getElementById(`card-${id}`).classList.add('picked-start');
                selectionType = 'end';
                showToast("再点一次【终点】(同点则闭环)", false);
            } else {
                endPoint = allPlaces.find(x => x.id === id);
                document.getElementById(`card-${id}`).classList.add('picked-end');
                isSelecting = false;
                runOptimization(day);
            }
        }

        async function runOptimization(day) {
            const dayPlaces = allPlaces.filter(p => p.day === day);
            let optimized = [startPoint];
            let unvisited = dayPlaces.filter(p => p.id !== startPoint.id);
            
            // 如果起终点不同，还要在待访列表里剔除终点，最后再加回去
            if (startPoint.id !== endPoint.id) {
                unvisited = unvisited.filter(p => p.id !== endPoint.id);
            }

            let current = startPoint;
            while (unvisited.length > 0) {
                let nearestIdx = 0, minDist = Infinity;
                unvisited.forEach((p, i) => {
                    let d = Math.sqrt((current.lat-p.lat)**2 + (current.lng-p.lng)**2);
                    if (d < minDist) { minDist = d; nearestIdx = i; }
                });
                current = unvisited.splice(nearestIdx, 1)[0];
                optimized.push(current);
            }
            if (startPoint.id !== endPoint.id) optimized.push(endPoint);

            if (confirm(`规划成功：${optimized.map(p=>p.name).join(' -> ')}\n确定同步吗？`)) {
                showToast("正在同步...", false);
                for (let i = 0; i < optimized.length; i++) {
                    await notionReq(`/pages/${optimized[i].id}`, 'PATCH', { properties: { '当日顺序': { number: i + 1 } } });
                }
                showToast("同步完成！", true); resetSelectMode(); loadData();
            } else { resetSelectMode(); }
        }

        function resetSelectMode() {
            isSelecting = false; startPoint = null; endPoint = null;
            document.querySelectorAll('.optimize-btn').forEach(b => { b.innerText = "点选优化"; b.classList.remove('active'); });
            document.querySelectorAll('.poi-card').forEach(el => el.className = 'poi-card');
            showToast("", true);
        }

        function renderMap() {
            polylines.forEach(p => map.removeLayer(p));
            Object.values(markers).forEach(m => map.removeLayer(m));
            polylines = []; markers = {};
            const groups = {};
            allPlaces.forEach(p => { if(!groups[p.day]) groups[p.day]=[]; groups[p.day].push(p); });
            Object.entries(groups).forEach(([day, places], idx) => {
                const color = COLORS[idx % COLORS.length];
                places.sort((a,b) => a.order - b.order);
                const coords = places.map(p => {
                    const icon = L.divIcon({ className: '', html: `<div class="poi-num" style="background:${color}; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,0.3)">${p.order}</div>` });
                    markers[p.id] = L.marker([p.lat, p.lng], {icon}).addTo(map);
                    return [p.lat, p.lng];
                });
                if(coords.length > 1) polylines.push(L.polyline(coords, {color, weight:4}).addTo(map));
            });
        }

        function showToast(m, h){ 
            const t=document.getElementById('toast'); 
            if(!m){t.style.display='none';return;} 
            t.textContent=m; t.style.display='block'; 
            if(h) setTimeout(()=>t.style.display='none', 2000); 
        }
    </script>
</body>
</html>
