<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let allPlaces = [];
let leafletMarkers = {};
let routeLayers = [];

let route = {
  from: null,
  to: null,
  mode: 'driving',
  dist: '',
  time: ''
};

const DAY_COLORS = {
  'Day 1':'#1a73e8',
  'Day 2':'#34a853',
  'Day 3':'#fa7b17',
  'Day 4':'#9334e6',
  'Day 5':'#ea4335'
};

const CAT_EMOJI = {
  '餐厅':'🍜',
  '景点':'🗺',
  '酒店':'🏨',
  '购物':'🛍'
};

const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://cors-proxy.fringe.zone/${url}`,
];

window.onload = () => {

  map = L.map('map').setView([22,114],10);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
      attribution:'© OpenStreetMap © CARTO',
      subdomains:'abcd',
      maxZoom:19
    }
  ).addTo(map);

  const cfg = getConfig();

  if (!cfg) {

    document
      .getElementById('cfg-overlay')
      .classList
      .remove('hidden');

  } else {

    document
      .getElementById('cfg-overlay')
      .classList
      .add('hidden');

    loadData();
  }
};

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

async function fetchWithTimeout(
  url,
  opts={},
  timeout=15000
){

  const controller = new AbortController();

  const timer = setTimeout(()=>{
    controller.abort();
  },timeout);

  try {

    const res = await fetch(url,{
      ...opts,
      signal:controller.signal
    });

    clearTimeout(timer);

    return res;

  } catch(err){

    clearTimeout(timer);

    throw err;
  }
}

function getConfig(){
  try {
    return JSON.parse(
      localStorage.getItem('ntm_cfg')
    );
  } catch(e){
    return null;
  }
}

function openConfig(){

  const cfg = getConfig() || {};

  document.getElementById('cfg-token').value = cfg.token || '';
  document.getElementById('cfg-dbid').value = cfg.dbid || '';

  document
    .getElementById('cfg-overlay')
    .classList
    .remove('hidden');
}

function cancelConfig(){

  if (getConfig()) {

    document
      .getElementById('cfg-overlay')
      .classList
      .add('hidden');
  }
}

function saveConfig(){

  const token =
    document
      .getElementById('cfg-token')
      .value
      .trim();

  const dbid =
    document
      .getElementById('cfg-dbid')
      .value
      .trim()
      .replace(/-/g,'');

  if (!token || !dbid) {
    alert('请填写完整');
    return;
  }

  localStorage.setItem(
    'ntm_cfg',
    JSON.stringify({token,dbid})
  );

  document
    .getElementById('cfg-overlay')
    .classList
    .add('hidden');

  loadData();
}

async function notionReq(
  path,
  method='GET',
  body=null,
  proxyIdx=0,
  retry=0
){

  const cfg = getConfig();

  const baseUrl =
    'https://api.notion.com/v1' + path;

  const proxyUrl =
    PROXIES[proxyIdx](baseUrl);

  const opts = {
    method,
    headers:{
      'Authorization':`Bearer ${cfg.token}`,
      'Notion-Version':'2022-06-28',
      'Content-Type':'application/json'
    }
  };

  if (body) {
    opts.body = JSON.stringify(body);
  }

  try {

    const res = await fetchWithTimeout(
      proxyUrl,
      opts,
      12000
    );

    if (!res.ok) {

      if (
        proxyIdx < PROXIES.length - 1
      ) {

        return notionReq(
          path,
          method,
          body,
          proxyIdx + 1,
          retry
        );
      }

      if (retry < 2) {

        await sleep(1000 * (retry+1));

        return notionReq(
          path,
          method,
          body,
          0,
          retry + 1
        );
      }

      throw new Error(
        `HTTP ${res.status}`
      );
    }

    return await res.json();

  } catch(err){

    if (retry < 2) {

      await sleep(1000 * (retry+1));

      return notionReq(
        path,
        method,
        body,
        0,
        retry + 1
      );
    }

    throw err;
  }
}

async function loadData(){

  showToast('加载数据中...');

  try {

    const cfg = getConfig();

    if (!cfg) {
      openConfig();
      return;
    }

    let results = [];
    let cursor;

    do {

      const body = {
        page_size:100
      };

      if (cursor) {
        body.start_cursor = cursor;
      }

      const data = await notionReq(
        `/databases/${cfg.dbid}/query`,
        'POST',
        body
      );

      results = results.concat(data.results);

      cursor = data.has_more
        ? data.next_cursor
        : null;

    } while(cursor);

    allPlaces = results
      .map(parsePage)
      .filter(p => p.lat && p.lng);

    renderSidebar();

    await renderMap();

    showToast(
      `已加载 ${allPlaces.length} 个地点`,
      true
    );

  } catch(err){

    console.error(err);

    showToast(
      '加载失败：' + err.message,
      true
    );
  }
}

function parsePage(page){

  const p = page.properties;

  const txt = k =>
    p[k]?.rich_text?.[0]?.plain_text || '';

  const ttl = k =>
    p[k]?.title?.[0]?.plain_text || '';

  const sel = k =>
    p[k]?.select?.name || '';

  const num = k =>
    p[k]?.number ?? null;

  const latlng = txt('经纬度');

  const parts = latlng.split(',');

  const lat = parseFloat(parts[0]);
  const lng = parseFloat(parts[1]);

  return {
    id:page.id,
    name:ttl('地点名'),
    address:txt('地址'),
    latlng,
    lat:isNaN(lat)?null:lat,
    lng:isNaN(lng)?null:lng,
    category:sel('分类'),
    day:sel('行程日'),
    order:num('当日顺序')
  };
}

function renderSidebar(){

  const list =
    document.getElementById('poi-list');

  const groups = groupByDay(allPlaces);

  list.innerHTML = Object.entries(groups)
    .map(([day,places])=>{

      const color =
        DAY_COLORS[day] || '#999';

      const cards = places.map(p=>`

        <div
          class="poi-card"
          id="card-${p.id}"
          onclick="focusPlace('${p.id}')"
        >

          <div
            class="poi-num"
            style="background:${color}"
          >
            ${p.order ?? '—'}
          </div>

          <div>

            <div class="poi-name">
              ${esc(p.name)}
              ${CAT_EMOJI[p.category] || ''}
            </div>

            <div class="poi-meta">
              ${esc(p.address || '')}
            </div>

          </div>

        </div>

      `).join('');

      return `

        <div class="day-section">

          <div class="day-header">

            <div
              class="day-dot"
              style="background:${color}"
            ></div>

            <div class="day-label">
              ${day}
            </div>

          </div>

          ${cards}

        </div>
      `;

    }).join('');
}

async function renderMap(){

  Object.values(leafletMarkers)
    .forEach(m=>map.removeLayer(m));

  routeLayers
    .forEach(r=>map.removeLayer(r));

  leafletMarkers = {};
  routeLayers = [];

  const bounds = [];

  allPlaces.forEach(p=>{

    const color =
      DAY_COLORS[p.day] || '#999';

    const ll = [p.lat,p.lng];

    bounds.push(ll);

    const icon = L.divIcon({
      className:'',
      html:`
        <div style="
          width:28px;
          height:28px;
          border-radius:50%;
          background:${color};
          border:2px solid #fff;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#fff;
          font-size:11px;
          font-weight:700;
          box-shadow:0 2px 8px rgba(0,0,0,.25);
        ">
          ${p.order ?? ''}
        </div>
      `,
      iconSize:[28,28],
      iconAnchor:[14,14]
    });

    const marker = L.marker(ll,{icon})
      .addTo(map);

    marker.bindPopup(`
      <div style="min-width:160px">
        <div style="font-weight:700;margin-bottom:6px">
          ${esc(p.name)}
        </div>
        <div style="font-size:12px;color:#666">
          ${esc(p.address || '')}
        </div>
      </div>
    `);

    marker.on('click',()=>{
      highlightCard(p.id);
    });

    leafletMarkers[p.id] = marker;
  });

  await drawDayRoutes();

  if (bounds.length) {

    map.fitBounds(bounds,{padding:[30,30]});
  }
}

async function drawDayRoutes(){

  const groups = groupByDay(allPlaces);

  for (const [day,places] of Object.entries(groups)) {

    if (
      day === '未分组' ||
      places.length < 2
    ) continue;

    const color =
      DAY_COLORS[day] || '#999';

    const sorted = [...places]
      .sort((a,b)=>(a.order ?? 999)-(b.order ?? 999));

    let coords = sorted.map(p=>
      `${p.lng},${p.lat}`
    );

    const first = sorted[0];
    const last = sorted[sorted.length - 1];

    const isLoop =
      first.id === last.id;

    if (isLoop) {

      coords.push(
        `${first.lng + 0.00001},${first.lat + 0.00001}`
      );

      coords.push(
        `${first.lng},${first.lat}`
      );
    }

    try {

      const url =
        `https://router.project-osrm.org/route/v1/driving/` +
        coords.join(';') +
        `?overview=full` +
        `&geometries=geojson` +
        `&steps=false`;

      const res = await fetchWithTimeout(
        url,
        {},
        15000
      );

      const data = await res.json();

      if (
        data.code !== 'Ok' ||
        !data.routes?.length
      ) continue;

      const geometry =
        data.routes[0].geometry.coordinates;

      const latlngs = geometry.map(c=>[
        c[1],
        c[0]
      ]);

      const line = L.polyline(latlngs,{
        color,
        weight:5,
        opacity:0.85,
        lineCap:'round',
        lineJoin:'round'
      }).addTo(map);

      line.on('click',()=>{

        openRoute(
          sorted[0],
          sorted[1]
        );
      });

      routeLayers.push(line);

    } catch(err){

      console.error(
        'OSRM route error:',
        err
      );
    }
  }
}

function openRoute(from,to){

  route = {
    from,
    to,
    mode:'driving',
    dist:'',
    time:''
  };

  document
    .getElementById('route-panel')
    .style.display = 'block';

  document
    .getElementById('route-from-to')
    .textContent = `${from.name} → ${to.name}`;

  calcRoute();
}

function closeRoute(){

  document
    .getElementById('route-panel')
    .style.display = 'none';
}

function setMode(btn,mode){

  document
    .querySelectorAll('.mode-btn')
    .forEach(b=>b.classList.remove('on'));

  btn.classList.add('on');

  route.mode = mode;

  calcRoute();
}

async function calcRoute(){

  document
    .getElementById('route-result')
    .textContent = '计算中...';

  const {
    from,
    to,
    mode
  } = route;

  try {

    if (mode === 'transit') {

      document
        .getElementById('route-result')
        .innerHTML = '公交模式暂为估算';

      return;
    }

    const profile =
      mode === 'walking'
      ? 'foot'
      : 'driving';

    const url =
      `https://router.project-osrm.org/route/v1/${profile}/` +
      `${from.lng},${from.lat};${to.lng},${to.lat}` +
      `?overview=full&geometries=geojson`;

    const res = await fetchWithTimeout(
      url,
      {},
      15000
    );

    const data = await res.json();

    if (
      data.code !== 'Ok' ||
      !data.routes?.length
    ) {
      throw new Error('路线失败');
    }

    const r = data.routes[0];

    route.dist =
      (r.distance/1000).toFixed(1) + ' km';

    route.time =
      Math.round(r.duration/60) + ' 分钟';

    document
      .getElementById('route-result')
      .innerHTML = `
        <strong>${route.time}</strong>
        ·
        ${route.dist}
      `;

    document
      .getElementById('route-save-btn')
      .style.display = 'block';

  } catch(err){

    console.error(err);

    document
      .getElementById('route-result')
      .textContent = '路线失败';
  }
}

async function writeRouteToNotion(){

  const btn =
    document.getElementById('route-save-btn');

  btn.textContent = '更新中...';
  btn.disabled = true;

  try {

    await notionReq(
      `/pages/${route.from.id}`,
      'PATCH',
      {
        properties:{
          '交通耗时':{
            rich_text:[{
              text:{
                content:`${route.time} / ${route.dist}`
              }
            }]
          }
        }
      }
    );

    btn.textContent = '✓ 已更新';
    btn.classList.add('ok');

  } catch(err){

    btn.textContent = '更新失败';

  } finally {

    btn.disabled = false;
  }
}

function groupByDay(places){

  const g = {};

  places.forEach(p=>{

    const d = p.day || '未分组';

    if (!g[d]) {
      g[d] = [];
    }

    g[d].push(p);
  });

  Object.values(g).forEach(arr=>{

    arr.sort((a,b)=>
      (a.order ?? 999) -
      (b.order ?? 999)
    );
  });

  return g;
}

function focusPlace(id){

  const p = allPlaces.find(x=>x.id===id);

  if (!p) return;

  map.flyTo([p.lat,p.lng],16);

  leafletMarkers[id].openPopup();

  highlightCard(id);
}

function highlightCard(id){

  document
    .querySelectorAll('.poi-card')
    .forEach(el=>el.classList.remove('active'));

  const el =
    document.getElementById('card-' + id);

  if (el) {

    el.classList.add('active');

    el.scrollIntoView({
      block:'nearest'
    });
  }
}

let toastTimer;

function showToast(msg,autoHide=false){

  const el =
    document.getElementById('toast');

  el.textContent = msg;

  el.classList.add('show');

  clearTimeout(toastTimer);

  if (autoHide) {

    toastTimer = setTimeout(()=>{

      el.classList.remove('show');

    },2500);
  }
}

function esc(s){

  return (s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
