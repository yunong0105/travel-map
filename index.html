<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 我的旅行规划地图 (高德版)</title>
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: "" }; // 稍后在设置中动态填入
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_KEY&plugin=AMap.Driving,AMap.Transfer,AMap.Walking,AMap.PolylineEditor"></script>
    <style>
        :root { --primary: #007aff; --bg: #f5f5f7; --sidebar-w: 300px; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: var(--bg); overflow: hidden; }
        
        #main { display: flex; height: 100%; }
        #map-container { flex: 1; position: relative; }
        
        /* 侧边栏 */
        #sidebar { 
            width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; 
            display: flex; flex-direction: column; z-index: 10; transition: 0.3s;
        }
        #sidebar-header { padding: 20px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
        #poi-list { flex: 1; overflow-y: auto; padding: 10px; }
        .day-section { margin-bottom: 15px; }
        .day-title { font-size: 12px; color: #888; text-transform: uppercase; padding: 5px 10px; background: #fafafa; border-radius: 4px; }
        .poi-card { 
            padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #eee; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .poi-card:hover { background: #f0f7ff; border-color: var(--primary); }
        .poi-order { width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; }

        /* 配置弹窗 */
        #config-modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            display: flex; align-items: center; justify-content: center; z-index: 999; 
        }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* 路线面板 */
        #route-panel { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none; width: 280px; z-index: 100;
        }

        @media (max-width: 768px) {
            #sidebar { position: absolute; transform: translateX(-100%); height: 50%; bottom: 0; width: 100%; border-right: none; border-top: 1px solid #ddd; }
            #sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="config-modal">
    <div class="modal-content">
        <h3 style="margin-top:0">⚙️ 初始化配置</h3>
        <label style="font-size:12px">Notion Token</label>
        <input type="password" id="notion-token" placeholder="secret_xxxxxx">
        <label style="font-size:12px">Database ID</label>
        <input type="text" id="db-id" placeholder="32位字符">
        <label style="font-size:12px">高德地图 Key (Web端JS API)</label>
        <input type="text" id="amap-key" placeholder="高德控制台申请的Key">
        <label style="font-size:12px">高德地图 安全密钥</label>
        <input type="password" id="amap-security" placeholder="必填，否则无法显示">
        <button class="save-btn" onclick="saveConfig()">进入地图</button>
    </div>
</div>

<div id="main">
    <div id="sidebar">
        <div id="sidebar-header">
            <span>行程清单</span>
            <button onclick="fetchNotionData()" style="border:none; background:none; cursor:pointer; color:var(--primary)">🔄 刷新</button>
        </div>
        <div id="poi-list">
            <p style="text-align:center; color:#999; margin-top:20px;">等待数据加载...</p>
        </div>
    </div>
    <div id="map-container">
        <div id="container" style="width:100%; height:100%"></div>
        <div id="route-panel">
            <div id="route-info" style="font-size:14px; margin-bottom:10px; font-weight:bold"></div>
            <select id="mode-select" style="width:100%; padding:5px; margin-bottom:10px">
                <option value="driving">🚗 驾车</option>
                <option value="transfer">🚌 公交</option>
                <option value="walking">🚶 步行</option>
            </select>
            <div id="route-detail" style="font-size:12px; color:#666; margin-bottom:10px">计算中...</div>
            <button class="save-btn" id="sync-notion-btn" style="padding:8px">更新到 Notion</button>
        </div>
    </div>
</div>

<script>
    let map, markers = [], polylines = [];
    const DAY_COLORS = { 'Day 1': '#007aff', 'Day 2': '#34c759', 'Day 3': '#ff9500', 'Day 4': '#5856d6', 'Day 5': '#ff3b30' };
    const EMOJIS = { '餐厅': '🍜', '景点': '🗺️', '酒店': '🏨', '交通枢纽': '✈️', '购物': '🛍️' };

    // 1. 配置管理
    function saveConfig() {
        const config = {
            token: document.getElementById('notion-token').value,
            dbId: document.getElementById('db-id').value,
            key: document.getElementById('amap-key').value,
            sec: document.getElementById('amap-security').value
        };
        localStorage.setItem('map_config', JSON.stringify(config));
        location.reload();
    }

    // 2. 初始化加载
    window.onload = function() {
        const cfg = JSON.parse(localStorage.getItem('map_config'));
        if (cfg && cfg.key) {
            document.getElementById('config-modal').style.display = 'none';
            window._AMapSecurityConfig.securityJsCode = cfg.sec;
            
            const script = document.createElement('script');
            script.src = `https://webapi.amap.com/maps?v=2.0&key=${cfg.key}&plugin=AMap.Driving,AMap.Transfer,AMap.Walking`;
            script.onload = initMap;
            document.head.appendChild(script);
        }
    };

    function initMap() {
        map = new AMap.Map('container', { zoom: 11, viewMode: '3D' });
        fetchNotionData();
    }

    // 3. 核心：从 Notion 获取数据 (使用代理)
    async function fetchNotionData() {
        const cfg = JSON.parse(localStorage.getItem('map_config'));
        const proxy = "https://cors-proxy.fringe.zone/https://api.notion.com/v1/databases/" + cfg.dbId + "/query";
        
        try {
            const res = await fetch(proxy, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${cfg.token}`,
                    'Notion-Version': '2022-06-28',
                    'Content-Type': 'application/json'
                }
            });
            const data = await res.json();
            renderData(data.results);
        } catch (e) {
            alert("数据加载失败，请检查配置或代理状态");
        }
    }

    // 4. 渲染 Marker 和 连线
    function renderData(results) {
        // 清理旧内容
        map.remove(markers);
        map.remove(polylines);
        markers = []; polylines = [];

        const pois = results.map(page => {
            const p = page.properties;
            return {
                id: page.id,
                name: p['地点名']?.title[0]?.plain_text || '无名',
                day: p['行程日']?.select?.name || '未安排',
                order: p['当日顺序']?.number || 0,
                latlng: p['经纬度']?.rich_text[0]?.plain_text || '',
                cat: p['分类']?.select?.name || '其他'
            };
        }).filter(item => item.latlng.includes(','));

        // 按天分组渲染
        const days = {};
        pois.forEach(p => {
            if(!days[p.day]) days[p.day] = [];
            days[p.day].push(p);
        });

        const listHtml = [];
        Object.keys(days).sort().forEach(day => {
            const color = DAY_COLORS[day] || '#999';
            days[day].sort((a,b) => a.order - b.order);
            
            listHtml.push(`<div class="day-section"><div class="day-title">${day}</div>`);
            
            const path = [];
            days[day].forEach((p, idx) => {
                const [lat, lng] = p.latlng.split(',').map(Number);
                path.push([lng, lat]);

                // 创建 Marker
                const marker = new AMap.Marker({
                    position: [lng, lat],
                    content: `<div style="text-align:center"><div style="font-size:20px">${EMOJIS[p.cat]||'📍'}</div><div style="background:${color}; color:white; font-size:10px; border-radius:4px; padding:2px 5px">${p.name}</div></div>`,
                    extData: p,
                    map: map
                });
                markers.push(marker);

                listHtml.push(`
                    <div class="poi-card" onclick="focusPOI(${lng}, ${lat})">
                        <div class="poi-order" style="background:${color}">${p.order}</div>
                        <div>
                            <div style="font-weight:bold; font-size:14px">${p.name}</div>
                            <div style="font-size:11px; color:#999">${p.cat}</div>
                        </div>
                    </div>
                `);
            });
            listHtml.push(`</div>`);

            // 连线
            if(path.length > 1) {
                const line = new AMap.Polyline({
                    path: path, strokeColor: color, strokeWeight: 6, strokeOpacity: 0.8,
                    lineJoin: 'round', cursor: 'pointer', map: map
                });
                line.on('click', (e) => showRouteTool(days[day], e));
                polylines.push(line);
            }
        });
        document.getElementById('poi-list').innerHTML = listHtml.join('');
        map.setFitView();
    }

    function focusPOI(lng, lat) {
        map.setZoomAndCenter(15, [lng, lat]);
    }

    // 5. 路线规划与同步功能
    let currentRoutePair = null;
    function showRouteTool(dayPois, e) {
        // 找到点击位置最近的两个点
        const panel = document.getElementById('route-panel');
        panel.style.display = 'block';
        
        // 演示逻辑：默认取该天第一对（实际应用中可根据点击位置细化）
        const start = dayPois[0];
        const end = dayPois[1];
        currentRoutePair = { start, end };
        
        document.getElementById('route-info').innerText = `${start.name} ➔ ${end.name}`;
        calculateRoute();
    }

    async function calculateRoute() {
        const mode = document.getElementById('mode-select').value;
        const { start, end } = currentRoutePair;
        const [sLat, sLng] = start.latlng.split(',').map(Number);
        const [eLat, eLng] = end.latlng.split(',').map(Number);

        let service;
        if(mode === 'driving') service = new AMap.Driving();
        else if(mode === 'transfer') service = new AMap.Transfer({ city: '全国' });
        else service = new AMap.Walking();

        service.search([sLng, sLat], [eLng, eLat], (status, result) => {
            if(status === 'complete') {
                const route = result.routes[0];
                const dist = (route.distance/1000).toFixed(1);
                const time = Math.round(route.time / 60);
                const infoStr = `${time} min / ${dist} km`;
                document.getElementById('route-detail').innerText = infoStr;
                
                document.getElementById('sync-notion-btn').onclick = () => syncToNotion(start.id, infoStr, mode);
            }
        });
    }

    async function syncToNotion(pageId, info, mode) {
        const cfg = JSON.parse(localStorage.getItem('map_config'));
        const modeNames = { driving: '驾车', transfer: '公共交通', walking: '步行' };
        const btn = document.getElementById('sync-notion-btn');
        btn.innerText = "同步中...";

        try {
            await fetch(`https://cors-proxy.fringe.zone/https://api.notion.com/v1/pages/${pageId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${cfg.token}`,
                    'Notion-Version': '2022-06-28',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    properties: {
                        '交通耗时': { rich_text: [{ text: { content: info } }] },
                        '交通方式': { select: { name: modeNames[mode] } }
                    }
                })
            });
            btn.innerText = "✅ 已更新";
            setTimeout(() => { document.getElementById('route-panel').style.display='none'; }, 1000);
        } catch (e) {
            alert("同步失败");
            btn.innerText = "重试";
        }
    }
</script>
</body>
</html>
