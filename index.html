<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 我的旅行地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #007aff; --bg: #f5f5f7; --sidebar-w: 300px; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: var(--bg); overflow: hidden; }
        #main { display: flex; height: 100%; }
        #map-container { flex: 1; position: relative; z-index: 1; }
        #sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; }
        #sidebar-header { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #poi-list { flex: 1; overflow-y: auto; padding: 10px; }
        .day-section { margin-bottom: 15px; }
        .day-title { font-size: 12px; color: #888; text-transform: uppercase; padding: 5px 10px; background: #fafafa; border-radius: 4px; margin-bottom: 5px; }
        .poi-card { padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #eee; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; background: #fff; }
        .poi-card:hover { background: #f0f7ff; border-color: var(--primary); }
        .poi-order { width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #config-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .icon-btn { border: none; background: none; cursor: pointer; color: var(--primary); font-size: 14px; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div id="config-modal" style="display: none;">
    <div class="modal-content">
        <h3 style="margin-top:0">⚙️ 配置 Notion</h3>
        <p style="font-size: 12px; color: #666;">配置将保存在本地浏览器，不会上传到 GitHub。</p>
        <label style="font-size:12px">Notion Token (ntn_...)</label>
        <input type="password" id="notion-token" placeholder="在此粘贴你的 Token">
        <label style="font-size:12px">Database ID (32位)</label>
        <input type="text" id="db-id" placeholder="在此粘贴数据库 ID">
        <button class="save-btn" onclick="saveConfig()">保存并查看地图</button>
    </div>
</div>

<div id="main">
    <div id="sidebar">
        <div id="sidebar-header">
            <span>行程清单</span>
            <div style="display:flex; gap:10px">
                <button onclick="fetchNotionData()" class="icon-btn">🔄 刷新</button>
                <button onclick="document.getElementById('config-modal').style.display='flex'" class="icon-btn" style="color:#666">⚙️</button>
            </div>
        </div>
        <div id="poi-list"></div>
    </div>
    <div id="map-container"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 这里没有任何 Token 信息，GitHub 不会再报错了
    let map, markers = [], polyline;
    const DAY_COLORS = { 'Day 1': '#007aff', 'Day 2': '#34c759', 'Day 3': '#ff9500', 'Day 4': '#5856d6' };

    function saveConfig() {
        const config = {
            token: document.getElementById('notion-token').value.trim(),
            dbId: document.getElementById('db-id').value.trim()
        };
        if (!config.token || !config.dbId) {
            alert("请完整填写信息！");
            return;
        }
        localStorage.setItem('notion_travel_config', JSON.stringify(config));
        location.reload();
    }

    window.onload = function() {
        map = L.map('map-container').setView([3.1390, 101.6869], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const cfg = JSON.parse(localStorage.getItem('notion_travel_config'));
        if (!cfg) {
            document.getElementById('config-modal').style.display = 'flex';
        } else {
            fetchNotionData();
        }
    };

    async function fetchNotionData() {
        const cfg = JSON.parse(localStorage.getItem('notion_travel_config'));
        // 使用一个稳健的代理，直接拼接请求
        const proxy = "https://corsproxy.io/?https://api.notion.com/v1/databases/" + cfg.dbId + "/query";
        
        try {
            const res = await fetch(proxy, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${cfg.token}`, 
                    'Notion-Version': '2022-06-28', 
                    'Content-Type': 'application/json' 
                }
            });
            const data = await res.json();
            if (data.results) {
                renderData(data.results);
            } else if (data.object === "error") {
                alert("Notion 错误: " + data.message + "\n请检查 Token 或 Connection。");
                localStorage.removeItem('notion_travel_config'); // 出错就清除配置重来
                location.reload();
            }
        } catch (e) {
            alert("网络错误，请稍后再试。");
        }
    }

    function renderData(results) {
        markers.forEach(m => map.removeLayer(m));
        if(polyline) map.removeLayer(polyline);
        markers = [];
        const pois = results.map(page => {
            const p = page.properties;
            return {
                name: p['地点名']?.title[0]?.plain_text || '未命名',
                day: p['行程日']?.select?.name || 'Day 1',
                order: p['当日顺序']?.number || 0,
                latlng: p['经纬度']?.rich_text[0]?.plain_text || ''
            };
        }).filter(item => item.latlng.includes(',')).sort((a, b) => a.order - b.order);

        const listHtml = [];
        const path = [];
        const days = {};
        pois.forEach(p => { if(!days[p.day]) days[p.day] = []; days[p.day].push(p); });

        Object.keys(days).sort().forEach(day => {
            const color = DAY_COLORS[day] || '#007aff';
            listHtml.push(`<div class="day-section"><div class="day-title">${day}</div>`);
            days[day].forEach(p => {
                const [lat, lng] = p.latlng.split(',').map(Number);
                path.push([lat, lng]);
                const marker = L.circleMarker([lat, lng], { radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.8 }).addTo(map);
                markers.push(marker);
                listHtml.push(`<div class="poi-card" onclick="map.flyTo([${lat}, ${lng}], 16)"><div class="poi-order" style="background:${color}">${p.order}</div><div><b>${p.name}</b><div style="font-size:11px;color:#999">${day}</div></div></div>`);
            });
            listHtml.push(`</div>`);
        });
        if (path.length > 1) polyline = L.polyline(path, {color: '#007aff', weight: 3, dashArray: '5, 10'}).addTo(map);
        document.getElementById('poi-list').innerHTML = listHtml.join('');
        if(path.length > 0) map.fitBounds(L.latLngBounds(path));
    }
</script>
</body>
</html>
