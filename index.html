<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺 旅行地图 - 智能路线版</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --primary:#1a73e8; --sidebar:320px; }
*{ box-sizing:border-box; margin:0; padding:0; }
body,html{ height:100%; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; overflow:hidden; }

/* ── 布局 ── */
#app{ display:flex; height:100vh; }
#sidebar{
  width:var(--sidebar); background:#fff; border-right:1px solid #eee;
  display:flex; flex-direction:column; z-index:10; flex-shrink:0;
}
#map-wrap{ flex:1; position:relative; }
#map{ width:100%; height:100%; }

/* ── 顶栏 ── */
#topbar{
  padding:14px 16px 10px; border-bottom:1px solid #eee;
  display:flex; align-items:center; justify-content:space-between;
}
#topbar h1{ font-size:15px; font-weight:700; color:#202124; }
.icon-btn{
  background:none; border:1px solid #e0e0e0; border-radius:8px;
  padding:5px 10px; font-size:12px; cursor:pointer; color:#5f6368;
  display:flex; align-items:center; gap:4px; transition:background .15s;
}
.icon-btn:hover{ background:#f1f3f4; }

/* ── 地点列表 ── */
#poi-list{ flex:1; overflow-y:auto; padding:10px 8px; }
.day-section{ margin-bottom:12px; }
.day-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 8px; margin-bottom:4px;
}
.day-header-left { display:flex; align-items:center; gap:8px; }
.day-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.day-label{ font-size:11px; font-weight:700; color:#5f6368; text-transform:uppercase; letter-spacing:.06em; }
.optimize-btn {
  font-size: 11px; color: var(--primary); background: #e8f0fe; border: none;
  padding: 3px 8px; border-radius: 12px; cursor: pointer; font-weight: 600;
}
.optimize-btn:hover { background: #d2e3fc; }

.poi-card{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 10px; border-radius:10px; cursor:pointer;
  transition:background .12s; margin-bottom:2px;
}
.poi-card:hover{ background:#f0f7ff; }
.poi-card.active{ background:#e8f0fe; }
.poi-num{
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  font-size:11px; font-weight:700; color:#fff;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.poi-name{ font-size:13px; font-weight:600; color:#202124; line-height:1.3; }
.poi-meta{ font-size:11px; color:#80868b; margin-top:2px; line-height:1.5; }

/* ── 路程面板 ── */
#route-panel{
  position:absolute; bottom:20px; right:20px; width:300px;
  background:#fff; border-radius:16px; padding:16px 18px;
  box-shadow:0 4px 24px rgba(0,0,0,.14);
  border:1px solid #e8e8e8; z-index:500;
  display:none;
}
#route-close{
  position:absolute; top:10px; right:12px;
  background:none; border:none; font-size:16px; cursor:pointer; color:#999;
}
#route-from-to{ font-size:13px; font-weight:600; color:#202124; margin-bottom:10px; line-height:1.4; }
.mode-btns{ display:flex; gap:6px; margin-bottom:10px; }
.mode-btn{
  flex:1; padding:6px 4px; border:1.5px solid #e0e0e0; border-radius:8px;
  background:#fff; cursor:pointer; font-size:12px; font-weight:500; text-align:center;
  transition:all .15s;
}
.mode-btn.on{ background:#e8f0fe; border-color:var(--primary); color:var(--primary); }
#route-result{ font-size:13px; color:#202124; min-height:32px; margin-bottom:10px; line-height:1.6; }
#route-save-btn{
  width:100%; padding:9px; background:var(--primary); color:#fff;
  border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
  display:none; transition:background .15s;
}

/* ── 配置弹窗 ── */
#cfg-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:9999; display:flex; align-items:center; justify-content:center;
}
#cfg-overlay.hidden{ display:none; }
#cfg-box{
  background:#fff; border-radius:20px; padding:26px 28px; width:360px; max-width:95vw;
  box-shadow:0 12px 48px rgba(0,0,0,.2);
}
.cfg-field input{
  width:100%; padding:9px 12px; border:1.5px solid #e0e0e0; border-radius:9px;
  font-size:13px; outline:none;
}

/* ── 加载提示 ── */
#toast{
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  background:#202124; color:#fff; padding:8px 18px; border-radius:20px;
  font-size:13px; z-index:600; opacity:0; pointer-events:none; transition:opacity .25s;
}
#toast.show{ opacity:1; }

@media(max-width:640px){
  #sidebar{ width:100%; height:45vh; }
  #app{ flex-direction:column; }
}
</style>
</head>
<body>

<div id="toast"></div>

<div id="cfg-overlay">
  <div id="cfg-box">
    <h2>⚙️ 配置 Notion</h2>
    <p>配置仅保存在本地浏览器</p>
    <div class="cfg-field">
      <label>Notion Token</label>
      <input id="cfg-token" type="password" placeholder="ntn_xxxxxxxxxx"/>
    </div>
    <div class="cfg-field">
      <label>Database ID</label>
      <input id="cfg-dbid" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/>
    </div>
    <button id="cfg-save" onclick="saveConfig()" style="width:100%; padding:11px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:10px;">保存并加载地图</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="topbar">
      <h1>🗺 旅行地图</h1>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" onclick="loadData()">🔄 刷新</button>
        <button class="icon-btn" onclick="openConfig()">⚙️</button>
      </div>
    </div>
    <div id="poi-list"></div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="route-panel">
      <button id="route-close" onclick="closeRoute()">✕</button>
      <div id="route-from-to"></div>
      <div class="mode-btns">
        <button class="mode-btn on" onclick="setMode(this,'driving')">🚗 驾车</button>
        <button class="mode-btn"    onclick="setMode(this,'transit')">🚌 公交</button>
        <button class="mode-btn"    onclick="setMode(this,'walking')">🚶 步行</button>
      </div>
      <div id="route-result">计算中...</div>
      <button id="route-save-btn" onclick="writeRouteToNotion()">更新到 Notion</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, allPlaces = [];
let leafletMarkers = {}, polylines = [], midMarkers = [];
let route = { from:null, to:null, mode:'driving', dist:'', time:'' };

const DAY_COLORS = {
  'Day 1':'#1a73e8','Day 2':'#34a853','Day 3':'#fa7b17',
  'Day 4':'#9334e6','Day 5':'#ea4335'
};
const CAT_EMOJI = { '餐厅':'🍜','景点':'🗺','酒店':'🏨','交通枢纽':'✈️','购物':'🛍' };
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://cors-proxy.fringe.zone/${url}`,
];

window.onload = () => {
  map = L.map('map', { zoomControl:true }).setView([22, 114], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  const cfg = getConfig();
  if (!cfg) {
    document.getElementById('cfg-overlay').classList.remove('hidden');
  } else {
    document.getElementById('cfg-overlay').classList.add('hidden');
    loadData();
  }
};

// --- 配置管理 ---
function getConfig() { try { return JSON.parse(localStorage.getItem('ntm_cfg')); } catch(e) { return null; } }
function saveConfig() {
  const token = document.getElementById('cfg-token').value.trim();
  const dbid  = document.getElementById('cfg-dbid').value.trim().replace(/-/g,'');
  if (!token || !dbid) { alert('请填写完整'); return; }
  localStorage.setItem('ntm_cfg', JSON.stringify({ token, dbid }));
  document.getElementById('cfg-overlay').classList.add('hidden');
  loadData();
}
function openConfig() {
  const cfg = getConfig() || {};
  document.getElementById('cfg-token').value = cfg.token || '';
  document.getElementById('cfg-dbid').value  = cfg.dbid  || '';
  document.getElementById('cfg-overlay').classList.remove('hidden');
}

// --- 数据交互 ---
async function notionReq(path, method='GET', body=null, proxyIdx=0) {
  const cfg = getConfig();
  const baseUrl = 'https://api.notion.com/v1' + path;
  const proxyUrl = PROXIES[proxyIdx](baseUrl);
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json',
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(proxyUrl, opts);
  if (!res.ok) {
    if (proxyIdx < PROXIES.length - 1) return notionReq(path, method, body, proxyIdx + 1);
    throw new Error(`HTTP ${res.status}`);
  }
  return res.json();
}

async function loadData() {
  showToast('加载数据中...');
  try {
    const cfg = getConfig();
    let results = [], cursor;
    do {
      const body = { page_size:100 };
      if (cursor) body.start_cursor = cursor;
      const data = await notionReq(`/databases/${cfg.dbid}/query`, 'POST', body);
      results = results.concat(data.results);
      cursor = data.has_more ? data.next_cursor : null;
    } while (cursor);
    allPlaces = results.map(parsePage).filter(p => p.lat && p.lng);
    renderSidebar();
    renderMap();
    showToast(`已加载 ${allPlaces.length} 个地点`, true);
  } catch(e) { showToast('加载失败：' + e.message, true); }
}

function parsePage(page) {
  const p = page.properties;
  const txt = k => p[k]?.rich_text?.[0]?.plain_text || '';
  const ttl = k => p[k]?.title?.[0]?.plain_text || '';
  const sel = k => p[k]?.select?.name || '';
  const num = k => p[k]?.number ?? null;
  const url = k => p[k]?.url || '';
  const parts = txt('经纬度').split(',');
  return {
    id: page.id, name: ttl('地点名'), address: txt('地址'),
    lat: parseFloat(parts[0]), lng: parseFloat(parts[1]),
    category: sel('分类'), day: sel('行程日'), order: num('当日顺序'),
    mapUrl: url('Google Maps URL'), website: url('网址'),
  };
}

// --- 渲染逻辑 ---
function renderSidebar() {
  const list = document.getElementById('poi-list');
  const groups = groupByDay(allPlaces);
  const dayOrder = ['Day 1','Day 2','Day 3','Day 4','Day 5','未分组'];
  const days = Object.keys(groups).sort((a,b) => dayOrder.indexOf(a)-dayOrder.indexOf(b));
  
  list.innerHTML = days.map(day => {
    const color = DAY_COLORS[day] || '#999';
    const isDay = day !== '未分组';
    const cards = groups[day].map(p => `
      <div class="poi-card" id="card-${p.id}" onclick="focusPlace('${p.id}')">
        <div class="poi-num" style="background:${color}">${p.order??'—'}</div>
        <div>
          <div class="poi-name">${esc(p.name)} ${CAT_EMOJI[p.category]||''}</div>
          <div class="poi-meta">${p.address ? esc(p.address) : ''}</div>
        </div>
      </div>`).join('');

    return `
      <div class="day-section">
        <div class="day-header">
          <div class="day-header-left">
            <div class="day-dot" style="background:${color}"></div>
            <div class="day-label">${day}</div>
          </div>
          ${isDay ? `<button class="optimize-btn" onclick="optimizeDayOrder('${day}')">🔀 优化顺序</button>` : ''}
        </div>
        ${cards}
      </div>`;
  }).join('');
}

function renderMap() {
  Object.values(leafletMarkers).forEach(m => map.removeLayer(m));
  polylines.forEach(p => map.removeLayer(p));
  midMarkers.forEach(m => map.removeLayer(m));
  leafletMarkers = {}; polylines = []; midMarkers = [];
  
  const bounds = [];
  allPlaces.forEach(p => {
    const color = DAY_COLORS[p.day] || '#999';
    const ll = [p.lat, p.lng];
    bounds.push(ll);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;">${p.order??''}</div>`,
      iconSize:[28,28], iconAnchor:[14,14],
    });
    const marker = L.marker(ll, { icon }).addTo(map);
    marker.on('click', () => highlightCard(p.id));
    leafletMarkers[p.id] = marker;
  });

  const groups = groupByDay(allPlaces);
  Object.entries(groups).forEach(([day, places]) => {
    if (day === '未分组') return;
    const color = DAY_COLORS[day] || '#999';
    for (let i = 0; i < places.length-1; i++) {
      const a = places[i], b = places[i+1];
      const poly = L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color, weight:3, opacity:.75 }).addTo(map);
      poly.on('click', () => openRoute(a, b));
      polylines.push(poly);
    }
  });
  if (bounds.length) map.fitBounds(bounds, { padding:[30,30] });
}

// --- 🚕 智能路线优化 (新增) ---
async function optimizeDayOrder(day) {
  const dayPlaces = allPlaces.filter(p => p.day === day);
  if (dayPlaces.length < 2) return;

  // 1. 选择起点
  const startIdx = prompt(
    `【${day}】规划优化\n请选择起点序号 (1-${dayPlaces.length}):\n` + 
    dayPlaces.map((p, i) => `${i+1}. ${p.name}`).join('\n'), "1"
  );
  if (!startIdx) return;
  
  showToast(`正在计算 ${day} 的最优路径...`);
  
  // 2. 贪心算法路径计算
  let unvisited = [...dayPlaces];
  let current = unvisited.splice(parseInt(startIdx)-1, 1)[0];
  let optimized = [current];

  while (unvisited.length > 0) {
    let nearestIdx = 0;
    let minDist = Infinity;
    
    // 调用 OSRM 获取真实距离矩阵（这里为简化演示使用直线距离，正式版可循环调用 OSRM）
    for (let i = 0; i < unvisited.length; i++) {
      let d = Math.sqrt(Math.pow(current.lat - unvisited[i].lat, 2) + Math.pow(current.lng - unvisited[i].lng, 2));
      if (d < minDist) { minDist = d; nearestIdx = i; }
    }
    current = unvisited.splice(nearestIdx, 1)[0];
    optimized.push(current);
  }

  // 3. 预览并确认
  const confirmStr = optimized.map((p, i) => `${i+1}. ${p.name}`).join(' → ');
  if (!confirm(`计算完成！最优顺序如下：\n${confirmStr}\n\n是否写入 Notion 数据库？`)) return;

  // 4. 写回 Notion
  showToast("正在同步到 Notion...", false);
  try {
    for (let i = 0; i < optimized.length; i++) {
      await notionReq(`/pages/${optimized[i].id}`, 'PATCH', {
        properties: { '当日顺序': { number: i + 1 } }
      });
    }
    showToast("✅ 顺序同步成功！", true);
    loadData(); // 重新拉取
  } catch(e) { alert("同步失败: " + e.message); }
}

// --- 交通计算 ---
async function calcRoute() {
  const { from, to, mode } = route;
  const profile = mode==='walking'?'foot':'driving';
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${from.lng},${from.lat};${to.lng},${to.lat}?overview=false`);
    const data = await res.json();
    const leg = data.routes[0].legs[0];
    route.dist = (leg.distance/1000).toFixed(1)+' km';
    route.time = Math.round(leg.duration/60)+' 分钟';
    document.getElementById('route-result').innerHTML = `<strong>${route.time}</strong> · ${route.dist}`;
    document.getElementById('route-save-btn').style.display = 'block';
  } catch(e) { document.getElementById('route-result').textContent = '计算失败'; }
}

// --- 工具函数 ---
function groupByDay(places) {
  const g = {};
  places.forEach(p => { const d=p.day||'未分组'; if(!g[d])g[d]=[]; g[d].push(p); });
  Object.values(g).forEach(arr => arr.sort((a,b)=>(a.order??99)-(b.order??99)));
  return g;
}
function focusPlace(id) {
  const p = allPlaces.find(x => x.id===id);
  if (p) { map.flyTo([p.lat,p.lng],16); leafletMarkers[id].openPopup(); highlightCard(id); }
}
function highlightCard(id) {
  document.querySelectorAll('.poi-card').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('card-'+id);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest' }); }
}
function showToast(msg, hide=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if(hide) setTimeout(()=>t.classList.remove('show'), 3000);
}
function esc(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
</script>
</body>
</html>
