<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺 旅行地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --primary:#1a73e8; --sidebar:300px; }
*{ box-sizing:border-box; margin:0; padding:0; }
body,html{ height:100%; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; overflow:hidden; }
#app{ display:flex; height:100vh; }
#sidebar{ width:var(--sidebar); background:#fff; border-right:1px solid #eee; display:flex; flex-direction:column; z-index:10; flex-shrink:0; }
#map-wrap{ flex:1; position:relative; }
#map{ width:100%; height:100%; }

#topbar{ padding:14px 16px 10px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
#topbar h1{ font-size:15px; font-weight:700; color:#202124; }
.icon-btn{ background:none; border:1px solid #e0e0e0; border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; color:#5f6368; display:flex; align-items:center; gap:4px; transition:background .15s; }
.icon-btn:hover{ background:#f1f3f4; }

#poi-list{ flex:1; overflow-y:auto; padding:10px 8px; }
.day-section{ margin-bottom:12px; }
.day-header{ display:flex; align-items:center; gap:8px; padding:6px 8px 4px; }
.day-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.day-label{ font-size:11px; font-weight:700; color:#5f6368; text-transform:uppercase; letter-spacing:.06em; flex:1; }
.optimize-btn{ font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid #e0e0e0; background:#fff; cursor:pointer; color:#5f6368; white-space:nowrap; transition:all .15s; }
.optimize-btn:hover{ background:#e8f0fe; border-color:var(--primary); color:var(--primary); }
.optimize-btn.loading{ color:#aaa; pointer-events:none; }
.optimize-btn.done{ background:#e6f4ea; border-color:#a8d5b5; color:#137333; }

.poi-card{ display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:10px; cursor:pointer; transition:background .12s; margin-bottom:2px; }
.poi-card:hover{ background:#f0f7ff; }
.poi-card.active{ background:#e8f0fe; }
.poi-num{ width:22px; height:22px; border-radius:50%; flex-shrink:0; font-size:11px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.poi-name{ font-size:13px; font-weight:600; color:#202124; line-height:1.3; }
.poi-meta{ font-size:11px; color:#80868b; margin-top:2px; line-height:1.5; }
.travel-time{ font-size:11px; color:#1a73e8; margin-top:2px; }

#route-panel{ position:absolute; bottom:20px; right:20px; width:300px; background:#fff; border-radius:16px; padding:16px 18px; box-shadow:0 4px 24px rgba(0,0,0,.14); border:1px solid #e8e8e8; z-index:500; display:none; }
#route-close{ position:absolute; top:10px; right:12px; background:none; border:none; font-size:16px; cursor:pointer; color:#999; }
#route-from-to{ font-size:13px; font-weight:600; color:#202124; margin-bottom:10px; line-height:1.4; }
.mode-btns{ display:flex; gap:6px; margin-bottom:10px; }
.mode-btn{ flex:1; padding:6px 4px; border:1.5px solid #e0e0e0; border-radius:8px; background:#fff; cursor:pointer; font-size:12px; font-weight:500; text-align:center; transition:all .15s; }
.mode-btn.on{ background:#e8f0fe; border-color:var(--primary); color:var(--primary); }
#route-result{ font-size:13px; color:#202124; min-height:32px; margin-bottom:10px; line-height:1.6; }
#route-save-btn{ width:100%; padding:9px; background:var(--primary); color:#fff; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; display:none; }
#route-save-btn:hover{ background:#1557b0; }
#route-save-btn.ok{ background:#137333; }

/* 起点终点选择弹窗 */
#startpoint-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9998; display:flex; align-items:center; justify-content:center; }
#startpoint-overlay.hidden{ display:none; }
#startpoint-box{
  background:#fff; border-radius:16px; padding:22px 24px;
  width:320px; max-width:95vw; max-height:85vh;
  display:flex; flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.2);
}
#startpoint-box h3{ font-size:15px; font-weight:700; color:#202124; flex-shrink:0; }
#startpoint-box p.subtitle{ font-size:12px; color:#80868b; margin:4px 0 12px; flex-shrink:0; }
#startpoint-list{ overflow-y:auto; flex:1; padding-right:2px; }
.sp-section-label{ font-size:11px; font-weight:600; color:#5f6368; text-transform:uppercase; letter-spacing:.04em; margin:10px 0 6px; }
.sp-section-label:first-child{ margin-top:0; }
.startpoint-option{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; cursor:pointer; border:1.5px solid #e0e0e0; margin-bottom:6px; transition:all .15s; }
.startpoint-option:hover{ background:#f0f7ff; border-color:var(--primary); }
.startpoint-option.selected-start{ background:#e8f0fe; border-color:var(--primary); }
.startpoint-option.selected-end{ background:#e6f4ea; border-color:#34a853; }
.startpoint-num{ width:22px; height:22px; border-radius:50%; font-size:11px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.startpoint-name{ font-size:13px; font-weight:500; color:#202124; }
.startpoint-btns{ display:flex; gap:8px; margin-top:14px; flex-shrink:0; }
.startpoint-btns button{ flex:1; padding:10px; border-radius:9px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
#sp-cancel{ background:#f1f3f4; color:#3c4043; }
#sp-confirm{ background:var(--primary); color:#fff; }
#sp-confirm:disabled{ background:#a8c7fa; cursor:not-allowed; }

#cfg-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; display:flex; align-items:center; justify-content:center; }
#cfg-overlay.hidden{ display:none; }
#cfg-box{ background:#fff; border-radius:20px; padding:26px 28px; width:360px; max-width:95vw; box-shadow:0 12px 48px rgba(0,0,0,.2); }
#cfg-box h2{ font-size:17px; font-weight:700; margin-bottom:6px; }
#cfg-box p{ font-size:12px; color:#80868b; margin-bottom:18px; }
.cfg-field{ margin-bottom:14px; }
.cfg-field label{ display:block; font-size:11px; font-weight:600; color:#5f6368; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.cfg-field input{ width:100%; padding:9px 12px; border:1.5px solid #e0e0e0; border-radius:9px; font-size:13px; outline:none; transition:border-color .15s; }
.cfg-field input:focus{ border-color:var(--primary); }
.cfg-field .hint{ font-size:11px; color:#aaa; margin-top:3px; }
#cfg-save{ width:100%; padding:11px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
#cfg-save:hover{ background:#1557b0; }
#cfg-cancel-btn{ width:100%; padding:8px; background:none; border:none; color:#80868b; font-size:13px; cursor:pointer; margin-top:6px; }

#toast{ position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#202124; color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; z-index:600; opacity:0; pointer-events:none; transition:opacity .25s; }
#toast.show{ opacity:1; }

@media(max-width:640px){
  #sidebar{ width:100%; height:40vh; border-right:none; border-bottom:1px solid #eee; }
  #app{ flex-direction:column; }
  #route-panel{ left:10px; right:10px; width:auto; bottom:10px; }
}
</style>
</head>
<body>

<div id="toast"></div>

<div id="cfg-overlay">
  <div id="cfg-box">
    <h2>⚙️ 配置 Notion</h2>
    <p>配置仅保存在本地浏览器，不会上传到任何地方</p>
    <div class="cfg-field">
      <label>Notion Token</label>
      <input id="cfg-token" type="password" placeholder="ntn_xxxxxxxxxx"/>
    </div>
    <div class="cfg-field">
      <label>Database ID</label>
      <input id="cfg-dbid" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/>
      <div class="hint">数据库 URL 中 ?v= 前面那段（不需要加横杠）</div>
    </div>
    <button id="cfg-save" onclick="saveConfig()">保存并加载地图</button>
    <button id="cfg-cancel-btn" onclick="cancelConfig()">取消</button>
  </div>
</div>

<!-- 起点终点选择弹窗 -->
<div id="startpoint-overlay" class="hidden">
  <div id="startpoint-box">
    <h3>🔀 优化游览顺序</h3>
    <p class="subtitle">分别选择起点和终点，中间地点自动排序</p>
    <div id="startpoint-list"></div>
    <div class="startpoint-btns">
      <button id="sp-cancel" onclick="closeStartpoint()">取消</button>
      <button id="sp-confirm" onclick="confirmOptimize()" disabled>开始优化</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="topbar">
      <h1>🗺 旅行地图</h1>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" onclick="loadData()">🔄 刷新</button>
        <button class="icon-btn" onclick="openConfig()">⚙️</button>
      </div>
    </div>
    <div id="poi-list"><p style="padding:20px;color:#aaa;font-size:13px;text-align:center">加载中...</p></div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="route-panel">
      <button id="route-close" onclick="closeRoute()">✕</button>
      <div id="route-from-to"></div>
      <div class="mode-btns">
        <button class="mode-btn on" onclick="setMode(this,'driving')">🚗 驾车</button>
        <button class="mode-btn"    onclick="setMode(this,'transit')">🚌 公交</button>
        <button class="mode-btn"    onclick="setMode(this,'walking')">🚶 步行</button>
      </div>
      <div id="route-result">计算中...</div>
      <button id="route-save-btn" onclick="writeRouteToNotion()">更新到 Notion</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, allPlaces = [];
let leafletMarkers = {}, polylines = [], midMarkers = [];
let route = { from:null, to:null, mode:'driving', dist:'', time:'' };
let optimizeState = { day:null, places:[], selectedStart:null, selectedEnd:null };

const DAY_COLORS = { 'Day 1':'#1a73e8','Day 2':'#34a853','Day 3':'#fa7b17','Day 4':'#9334e6','Day 5':'#ea4335' };
const CAT_EMOJI = { '餐厅':'🍜','景点':'🗺','酒店':'🏨','交通枢纽':'✈️','购物':'🛍' };
const PROXIES = [
  url => `https://notion-proxy-travel.yunong0105.workers.dev/?url=${encodeURIComponent(url)}`,
];

window.onload = () => {
  map = L.map('map',{zoomControl:true}).setView([22,114],10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(map);
  const cfg = getConfig();
  if (!cfg) {
    document.getElementById('cfg-overlay').classList.remove('hidden');
    document.getElementById('cfg-cancel-btn').style.display = 'none';
  } else {
    document.getElementById('cfg-overlay').classList.add('hidden');
    loadData();
  }
};

function getConfig() { try { return JSON.parse(localStorage.getItem('ntm_cfg')); } catch(e) { return null; } }
function openConfig() {
  const cfg = getConfig()||{};
  document.getElementById('cfg-token').value = cfg.token||'';
  document.getElementById('cfg-dbid').value  = cfg.dbid||'';
  document.getElementById('cfg-overlay').classList.remove('hidden');
}
function cancelConfig() { if (getConfig()) document.getElementById('cfg-overlay').classList.add('hidden'); }
function saveConfig() {
  const token = document.getElementById('cfg-token').value.trim();
  const dbid  = document.getElementById('cfg-dbid').value.trim().replace(/-/g,'');
  if (!token||!dbid) { alert('请填写完整'); return; }
  localStorage.setItem('ntm_cfg', JSON.stringify({token,dbid}));
  document.getElementById('cfg-overlay').classList.add('hidden');
  loadData();
}

async function notionReq(path, method='GET', body=null, proxyIdx=0) {
  const cfg = getConfig();
  const baseUrl = 'https://api.notion.com/v1' + path;
  const proxyUrl = PROXIES[proxyIdx](baseUrl);
  const opts = { method, headers:{ 'Authorization':`Bearer ${cfg.token}`, 'Notion-Version':'2022-06-28', 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(proxyUrl, opts);
  if (!res.ok) {
    if (proxyIdx < PROXIES.length-1) return notionReq(path, method, body, proxyIdx+1);
    throw new Error(`HTTP ${res.status}`);
  }
  return res.json();
}

async function loadData() {
  showToast('加载数据中...');
  try {
    const cfg = getConfig();
    if (!cfg) { openConfig(); return; }
    let results=[], cursor;
    do {
      const body = {page_size:100};
      if (cursor) body.start_cursor = cursor;
      const data = await notionReq(`/databases/${cfg.dbid}/query`,'POST',body);
      if (data.object==='error') throw new Error(data.message);
      results = results.concat(data.results);
      cursor = data.has_more ? data.next_cursor : null;
    } while(cursor);
    allPlaces = results.map(parsePage).filter(p => p.lat && p.lng);
    renderSidebar();
    renderMap();
    showToast(`已加载 ${allPlaces.length} 个地点`, true);
  } catch(e) {
    showToast('加载失败：'+e.message, true);
  }
}

function parsePage(page) {
  const p = page.properties;
  const txt = k => p[k]?.rich_text?.[0]?.plain_text||'';
  const ttl = k => p[k]?.title?.[0]?.plain_text||'';
  const sel = k => p[k]?.select?.name||'';
  const num = k => p[k]?.number??null;
  const url = k => p[k]?.url||'';
  const latlng = txt('经纬度');
  const parts = latlng.split(',');
  const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
  return {
    id:page.id, name:ttl('地点名'), address:txt('地址'),
    latlng, lat:isNaN(lat)?null:lat, lng:isNaN(lng)?null:lng,
    category:sel('分类'), day:sel('行程日'), order:num('当日顺序'),
    mapUrl:url('Google Maps URL'), rating:txt('评分'),
    price:txt('人均消费'), website:url('网址'),
    travelTime:txt('交通耗时'), travelMode:sel('交通方式'),
  };
}

function renderSidebar() {
  const list = document.getElementById('poi-list');
  if (!allPlaces.length) {
    list.innerHTML = '<p style="padding:20px;color:#aaa;font-size:13px;text-align:center">暂无地点<br>请先用 Tampermonkey 脚本添加</p>';
    return;
  }
  const groups = groupByDay(allPlaces);
  const dayOrder = ['Day 1','Day 2','Day 3','Day 4','Day 5','未分组'];
  const days = Object.keys(groups).sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));
  list.innerHTML = days.map(day => {
    const color = DAY_COLORS[day]||'#999';
    const places = groups[day];
    const cards = places.map(p => `
      <div class="poi-card" id="card-${p.id}" onclick="focusPlace('${p.id}')">
        <div class="poi-num" style="background:${color}">${p.order??'—'}</div>
        <div style="flex:1;min-width:0">
          <div class="poi-name">${esc(p.name)} ${CAT_EMOJI[p.category]||''}</div>
          <div class="poi-meta">
            ${p.address ? esc(p.address)+'<br>' : ''}
            ${p.rating  ? '⭐ '+esc(p.rating)+' ' : ''}
            ${p.price   ? '💰 '+esc(p.price) : ''}
          </div>
          ${p.travelTime ? `<div class="travel-time">→ ${esc(p.travelTime)} ${p.travelMode?'('+esc(p.travelMode)+')':''}</div>` : ''}
        </div>
      </div>`).join('');
    const canOptimize = places.length >= 2 && day !== '未分组';
    return `<div class="day-section">
      <div class="day-header">
        <div class="day-dot" style="background:${color}"></div>
        <div class="day-label">${day}</div>
        ${canOptimize ? `<button class="optimize-btn" id="opt-btn-${day.replace(' ','-')}" onclick="openStartpoint('${day}')">🔀 优化顺序</button>` : ''}
      </div>
      ${cards}
    </div>`;
  }).join('');
}

// ── 路线优化 ──
function openStartpoint(day) {
  const groups = groupByDay(allPlaces);
  const places = groups[day] || [];
  optimizeState = { day, places, selectedStart:null, selectedEnd:null };
  const color = DAY_COLORS[day] || '#999';

  document.getElementById('startpoint-list').innerHTML = `
    <div class="sp-section-label">🟢 起点（从哪里出发）</div>
    ${places.map(p => `
      <div class="startpoint-option" id="sp-s-${p.id}" onclick="selectStart('${p.id}')">
        <div class="startpoint-num" style="background:${color}">${p.order??'—'}</div>
        <div class="startpoint-name">${esc(p.name)}</div>
      </div>`).join('')}
    <div class="sp-section-label">🔴 终点（最终停在哪里）</div>
    ${places.map(p => `
      <div class="startpoint-option" id="sp-e-${p.id}" onclick="selectEnd('${p.id}')">
        <div class="startpoint-num" style="background:${color}">${p.order??'—'}</div>
        <div class="startpoint-name">${esc(p.name)}</div>
      </div>`).join('')}
  `;
  document.getElementById('sp-confirm').disabled = true;
  document.getElementById('startpoint-overlay').classList.remove('hidden');
}

function selectStart(id) {
  optimizeState.selectedStart = id;
  document.querySelectorAll('[id^="sp-s-"]').forEach(el => el.classList.remove('selected-start'));
  document.getElementById('sp-s-'+id)?.classList.add('selected-start');
  checkConfirmBtn();
}

function selectEnd(id) {
  optimizeState.selectedEnd = id;
  document.querySelectorAll('[id^="sp-e-"]').forEach(el => el.classList.remove('selected-end'));
  document.getElementById('sp-e-'+id)?.classList.add('selected-end');
  checkConfirmBtn();
}

function checkConfirmBtn() {
  document.getElementById('sp-confirm').disabled =
    !optimizeState.selectedStart || !optimizeState.selectedEnd;
}

function closeStartpoint() {
  document.getElementById('startpoint-overlay').classList.add('hidden');
}

async function confirmOptimize() {
  const { day, places, selectedStart, selectedEnd } = optimizeState;
  closeStartpoint();

  const dayKey = day.replace(' ','-');
  const btn = document.getElementById('opt-btn-'+dayKey);
  if (btn) { btn.textContent = '计算中...'; btn.className = 'optimize-btn loading'; }
  showToast(`正在优化 ${day} 的路线...`);

  try {
    const coords = places.map(p => `${p.lng},${p.lat}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration`);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error('距离矩阵计算失败');
    const matrix = data.durations;

    const startIdx = places.findIndex(p => p.id === selectedStart);
    const endIdx   = places.findIndex(p => p.id === selectedEnd);
    const n = places.length;

    // 起点和终点相同时，普通贪心
    if (startIdx === endIdx) {
      const visited = new Set([startIdx]);
      const ordered = [startIdx];
      let current = startIdx;
      while (visited.size < n) {
        let nearest = -1, minTime = Infinity;
        for (let j = 0; j < n; j++) {
          if (!visited.has(j) && matrix[current][j] < minTime) {
            minTime = matrix[current][j]; nearest = j;
          }
        }
        visited.add(nearest); ordered.push(nearest); current = nearest;
      }
      await writeOrders(places, ordered);
    } else {
      // 中间点贪心，起点终点固定
      const middleIndices = [];
      for (let i = 0; i < n; i++) {
        if (i !== startIdx && i !== endIdx) middleIndices.push(i);
      }
      const visited = new Set();
      const ordered = [startIdx];
      let current = startIdx;
      while (visited.size < middleIndices.length) {
        let nearest = -1, minTime = Infinity;
        for (const idx of middleIndices) {
          if (!visited.has(idx) && matrix[current][idx] < minTime) {
            minTime = matrix[current][idx]; nearest = idx;
          }
        }
        visited.add(nearest); ordered.push(nearest); current = nearest;
      }
      ordered.push(endIdx);
      await writeOrders(places, ordered);
    }

    if (btn) { btn.textContent = '✓ 已优化'; btn.className = 'optimize-btn done'; }
    showToast(`${day} 路线已优化，重新加载中...`);
    setTimeout(() => loadData(), 800);
  } catch(e) {
    if (btn) { btn.textContent = '🔀 优化顺序'; btn.className = 'optimize-btn'; }
    showToast('优化失败：'+e.message, true);
  }
}

async function writeOrders(places, orderedIndices) {
  const updates = orderedIndices.map((placeIdx, order) =>
    notionReq(`/pages/${places[placeIdx].id}`, 'PATCH', {
      properties: { '当日顺序': { number: order + 1 } }
    })
  );
  await Promise.all(updates);
}

// ── 地图渲染 ──
function renderMap() {
  Object.values(leafletMarkers).forEach(m => map.removeLayer(m));
  polylines.forEach(p => map.removeLayer(p));
  midMarkers.forEach(m => map.removeLayer(m));
  leafletMarkers={}; polylines=[]; midMarkers=[];
  if (!allPlaces.length) return;
  const bounds = [];
  allPlaces.forEach(p => {
    const color = DAY_COLORS[p.day]||'#999';
    const emoji = CAT_EMOJI[p.category]||'📍';
    const ll = [p.lat,p.lng];
    bounds.push(ll);
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;">${p.order??''}</div>`,
      iconSize:[28,28], iconAnchor:[14,14],
    });
    const marker = L.marker(ll,{icon}).addTo(map);
    marker.bindPopup(`
      <div style="font-family:-apple-system,'PingFang SC',sans-serif;min-width:160px;padding:2px">
        <div style="font-size:14px;font-weight:700;color:#202124;margin-bottom:4px">${emoji} ${esc(p.name)}</div>
        ${p.day?`<div style="font-size:12px;color:#1a73e8;margin-bottom:3px">${p.day}${p.order!=null?' · 第'+p.order+'站':''}</div>`:''}
        ${p.address?`<div style="font-size:12px;color:#5f6368;margin-bottom:2px">📍 ${esc(p.address)}</div>`:''}
        ${p.rating?`<div style="font-size:12px;color:#5f6368;margin-bottom:2px">⭐ ${esc(p.rating)}</div>`:''}
        ${p.price?`<div style="font-size:12px;color:#5f6368;margin-bottom:2px">💰 ${esc(p.price)}</div>`:''}
        ${p.travelTime?`<div style="font-size:12px;color:#1a73e8;margin-bottom:2px">🚗 下一站 ${esc(p.travelTime)}</div>`:''}
        ${p.website?`<div style="margin-top:5px"><a href="${esc(p.website)}" target="_blank" style="font-size:12px;color:#1a73e8">🌐 官网</a></div>`:''}
        ${p.mapUrl?`<div style="margin-top:3px"><a href="${esc(p.mapUrl)}" target="_blank" style="font-size:12px;color:#1a73e8">📍 Google Maps</a></div>`:''}
      </div>`,{maxWidth:220});
    marker.on('click',()=>highlightCard(p.id));
    leafletMarkers[p.id] = marker;
  });

  const groups = groupByDay(allPlaces);
  Object.entries(groups).forEach(([day,places])=>{
    if (day==='未分组') return;
    const color = DAY_COLORS[day]||'#999';
    for (let i=0;i<places.length-1;i++) {
      const a=places[i], b=places[i+1];
      const poly = L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color,weight:3,opacity:.75}).addTo(map);
      poly.on('click',()=>openRoute(a,b));
      polylines.push(poly);
      const midIcon = L.divIcon({
        className:'',
        html:`<div style="width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid ${color};box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:${color};font-weight:700;">⏱</div>`,
        iconSize:[18,18], iconAnchor:[9,9],
      });
      const mid = L.marker([(a.lat+b.lat)/2,(a.lng+b.lng)/2],{icon:midIcon}).addTo(map);
      mid.on('click',()=>openRoute(a,b));
      midMarkers.push(mid);
    }
  });
  if (bounds.length) map.fitBounds(bounds,{padding:[30,30]});
}

// ── 路程计算 ──
function openRoute(from, to) {
  route = {from,to,mode:'driving',dist:'',time:''};
  document.getElementById('route-from-to').textContent = `${from.name}  →  ${to.name}`;
  document.getElementById('route-result').textContent = '计算中...';
  document.getElementById('route-save-btn').style.display = 'none';
  document.getElementById('route-save-btn').textContent = '更新到 Notion';
  document.getElementById('route-save-btn').className = '';
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('on'));
  document.querySelector('.mode-btn').classList.add('on');
  document.getElementById('route-panel').style.display = 'block';
  calcRoute();
}
function closeRoute() { document.getElementById('route-panel').style.display='none'; }
function setMode(btn,mode) {
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); route.mode=mode; calcRoute();
}
async function calcRoute() {
  const {from, to, mode} = route;
  const modeMap = { driving:'driving', transit:'transit', walking:'walking' };
  const url = `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&travelmode=${modeMap[mode]}`;
  document.getElementById('route-result').innerHTML = `
    <a href="${url}" target="_blank" style="
      display:block; padding:10px; background:#1a73e8; color:#fff;
      border-radius:9px; text-align:center; font-weight:600;
      font-size:13px; text-decoration:none;
    ">在 Google Maps 查看路线 ↗</a>
    <div style="font-size:11px;color:#aaa;margin-top:6px;text-align:center">点击后在新标签页打开</div>`;
  document.getElementById('route-save-btn').style.display = 'none';
}
async function writeRouteToNotion() {
  const btn=document.getElementById('route-save-btn');
  btn.textContent='更新中...'; btn.disabled=true;
  const modeLabel={driving:'驾车',transit:'公共交通',walking:'步行'};
  try {
    await notionReq(`/pages/${route.from.id}`,'PATCH',{
      properties:{
        '交通耗时':{rich_text:[{text:{content:`${route.time} / ${route.dist}`}}]},
        '交通方式':{select:{name:modeLabel[route.mode]}},
      }
    });
    btn.textContent='✓ 已更新'; btn.className='ok'; btn.disabled=false;
  } catch(e) {
    btn.textContent='失败：'+e.message; btn.disabled=false;
  }
}

// ── 工具 ──
function groupByDay(places) {
  const g={};
  places.forEach(p=>{const d=p.day||'未分组';if(!g[d])g[d]=[];g[d].push(p);});
  Object.values(g).forEach(arr=>arr.sort((a,b)=>(a.order??99)-(b.order??99)));
  return g;
}
function focusPlace(id) {
  const p=allPlaces.find(x=>x.id===id);
  if(!p||!leafletMarkers[id]) return;
  map.flyTo([p.lat,p.lng],16);
  leafletMarkers[id].openPopup();
  highlightCard(id);
}
function highlightCard(id) {
  document.querySelectorAll('.poi-card').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('card-'+id);
  if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
}
let toastTimer;
function showToast(msg,autoHide=false) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  if(autoHide) toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
