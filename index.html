<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 我的旅行规划地图 (高德版)</title>
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: "" };
    </script>
    <style>
        :root { --primary: #007aff; --bg: #f5f5f7; --sidebar-w: 300px; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: var(--bg); overflow: hidden; }
        #main { display: flex; height: 100%; }
        #map-container { flex: 1; position: relative; }
        #sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; transition: 0.3s; }
        #sidebar-header { padding: 20px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
        #poi-list { flex: 1; overflow-y: auto; padding: 10px; }
        .day-section { margin-bottom: 15px; }
        .day-title { font-size: 12px; color: #888; text-transform: uppercase; padding: 5px 10px; background: #fafafa; border-radius: 4px; }
        .poi-card { padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #eee; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .poi-card:hover { background: #f0f7ff; border-color: var(--primary); }
        .poi-order { width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        #config-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #route-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: none; width: 280px; z-index: 100; }
        @media (max-width: 768px) { #sidebar { position: absolute; transform: translateX(-100%); height: 50%; bottom: 0; width: 100%; border-right: none; border-top: 1px solid #ddd; } #sidebar.open { transform: translateX(0); } }
    </style>
</head>
<body>

<div id="config-modal">
    <div class="modal-content">
        <h3 style="margin-top:0">⚙️ 高德地图版配置</h3>
        <label style="font-size:12px">Notion Token</label>
        <input type="password" id="notion-token" placeholder="secret_xxxxxx">
        <label style="font-size:12px">Database ID</label>
        <input type="text" id="db-id" placeholder="32位字符">
        <label style="font-size:12px">高德地图 Key (Web端JS API)</label>
        <input type="text" id="amap-key" placeholder="高德控制台申请的Key">
        <label style="font-size:12px">高德地图 安全密钥</label>
        <input type="password" id="amap-security" placeholder="必填项">
        <button class="save-btn" onclick="saveConfig()">保存并进入</button>
    </div>
</div>

<div id="main">
    <div id="sidebar">
        <div id="sidebar-header"><span>行程清单</span><button onclick="fetchNotionData()" style="border:none; background:none; cursor:pointer; color:var(--primary)">🔄 刷新</button></div>
        <div id="poi-list"><p style="text-align:center; color:#999; margin-top:20px;">数据加载中...</p></div>
    </div>
    <div id="map-container"><div id="container" style="width:100%; height:100%"></div><div id="route-panel"><div id="route-info" style="font-size:14px; margin-bottom:10px; font-weight:bold"></div><select id="mode-select" style="width:100%; padding:5px; margin-bottom:10px"><option value="driving">🚗 驾车</option><option value="transfer">🚌 公交</option><option value="walking">🚶 步行</option></select><div id="route-detail" style="font-size:12px; color:#666; margin-bottom:10px"></div><button class="save-btn" id="sync-notion-btn" style="padding:8px">更新到 Notion</button></div></div>
</div>

<script>
    let map, markers = [], polylines = [];
    const DAY_COLORS = { 'Day 1': '#007aff', 'Day 2': '#34c759', 'Day 3': '#ff9500', 'Day 4': '#5856d6', 'Day 5': '#ff3b30' };
    const EMOJIS = { '餐厅': '🍜', '景点': '🗺️', '酒店': '🏨', '交通枢纽': '✈️', '购物': '🛍️' };

    function saveConfig() {
        const config = {
            token: document.getElementById('notion-token').value,
            dbId: document.getElementById('db-id').value,
            key: document.getElementById('amap-key').value,
            sec: document.getElementById('amap-security').value
        };
        localStorage.setItem('amap_map_config', JSON.stringify(config));
        location.reload();
    }

    window.onload = function() {
        const cfg = JSON.parse(localStorage.getItem('amap_map_config'));
        if (cfg && cfg.key) {
            document.getElementById('config-modal').style.display = 'none';
            window._AMapSecurityConfig.securityJsCode = cfg.sec;
            const script = document.createElement('script');
            script.src = `https://webapi.amap.com/maps?v=2.0&key=${cfg.key}&plugin=AMap.Driving,AMap.Transfer,AMap.Walking`;
            script.onload = () => {
                map = new AMap.Map('container', { zoom: 11, viewMode: '3D' });
                fetchNotionData();
            };
            document.head.appendChild(script);
        }
    };

    async function fetchNotionData() {
        const cfg = JSON.parse(localStorage.getItem('amap_map_config'));
        const proxy = "https://cors-proxy.fringe.zone/https://api.notion.com/v1/databases/" + cfg.dbId + "/query";
        try {
            const res = await fetch(proxy, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${cfg.token}`, 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json' }
            });
            const data = await res.json();
            renderData(data.results);
        } catch (e) { alert("数据获取失败"); }
    }

    function renderData(results) {
        map.remove(markers); map.remove(polylines); markers = []; polylines = [];
        const pois = results.map(page => {
            const p = page.properties;
            return {
                id: page.id,
                name: p['地点名']?.title[0]?.plain_text || '无名',
                day: p['行程日']?.select?.name || '未安排',
                order: p['当日顺序']?.number || 0,
                latlng: p['经纬度']?.rich_text[0]?.plain_text || '',
                cat: p['分类']?.select?.name || '其他'
            };
        }).filter(item => item.latlng.includes(','));

        const days = {};
        pois.forEach(p => { if(!days[p.day]) days[p.day] = []; days[p.day].push(p); });
        const listHtml = [];
        Object.keys(days).sort().forEach(day => {
            const color = DAY_COLORS[day] || '#999';
            days[day].sort((a,b) => a.order - b.order);
            listHtml.push(`<div class="day-section"><div class="day-title">${day}</div>`);
            const path = [];
            days[day].forEach(p => {
                const [lat, lng] = p.latlng.split(',').map(Number);
                path.push([lng, lat]);
                const m = new AMap.Marker({ position: [lng, lat], map: map, content: `<div style="text-align:center"><div style="font-size:20px">${EMOJIS[p.cat]||'📍'}</div><div style="background:${color}; color:white; font-size:10px; border-radius:4px; padding:2px 5px">${p.name}</div></div>` });
                markers.push(m);
                listHtml.push(`<div class="poi-card" onclick="map.setZoomAndCenter(15, [${lng}, ${lat}])"><div class="poi-order" style="background:${color}">${p.order}</div><div><b>${p.name}</b><div style="font-size:11px; color:#999">${p.cat}</div></div></div>`);
            });
            if(path.length > 1) polylines.push(new AMap.Polyline({ path, strokeColor: color, strokeWeight: 6, map: map }));
            listHtml.push(`</div>`);
        });
        document.getElementById('poi-list').innerHTML = listHtml.join('');
        map.setFitView();
    }
</script>
</body>
</html>
